<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#90c322;--brand-d:#6f9a12;--brand-dd:#4f6e0b;--brand-ink:#16210a;--brand-t:#f3f9e6;--brand-t2:#e5f2c8;
  --page:#f4f6f1;--card:#ffffff;--card2:#f9fbf6;--ink:#141b0d;--ink2:#4b5543;--muted:#98a28c;--line:#e3e8da;--thbg:#f3f8e8;--rowalt:#fbfcf8;--hover:#f1f8e2;
  --s1:#7aa819;--s2:#a3adb8;--good:#12b76a;--good-ink:#067647;--warn:#fdb022;--serious:#f97066;--crit:#d92d20;--accent:#90c322;
  --gsc:#2a78d6;--ga:#f79009;--sem:#7a5af8;--ai:#d444f1;--pwg:#067647;--pwo:#4f6e0b;--pwa:#b54708;--pwr:#b42318;--pwb:#175cd3;--pwbar-ink:#14210d;--pw1:#05603a;--pw1bg:#e3f8ec;--pw1ring:rgba(18,183,106,.28);--pw2:#3f5a07;--pw2bg:#eff6dc;--pw2ring:rgba(111,154,18,.28);--pw4:#93370d;--pw4bg:#fff4e0;--pw4ring:rgba(220,104,3,.25);--pwgap:#b42318;--pwgbg:#fef0ee;--pwgring:rgba(217,45,32,.25);--pw1solid:#12b76a;--pw1solidink:#ffffff;--pw1glow:rgba(18,183,106,.3);--pw2solid:#a6cf45;--pw2solidink:#1d2b05;--pwwkbg:rgba(144,195,34,.06);--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--page:#0c0f09;--card:#141a10;--card2:#192015;--ink:#f1f5ea;--ink2:#b0baa4;--muted:#717c66;--line:#273021;--thbg:#1b2416;--rowalt:#161d12;--hover:#1f2a17;
  --brand-t:#1c2812;--brand-t2:#253618;--brand-dd:#b6e05a;
  --s1:#9fd12f;--s2:#6f7a86;--good-ink:#47cd89;--pwg:#6ee7a8;--pwo:#b9d97c;--pwa:#e3b45e;--pwr:#ef9a92;--pwb:#9cc9f5;--pwbar-ink:#f4fbef;--pw1:#7ee2ae;--pw1bg:rgba(18,183,106,.14);--pw1ring:rgba(50,213,131,.22);--pw2:#c3df86;--pw2bg:rgba(144,195,34,.11);--pw2ring:rgba(163,214,62,.18);--pw4:#f2c06b;--pw4bg:rgba(253,176,34,.1);--pw4ring:rgba(253,176,34,.18);--pwgap:#f4a19a;--pwgbg:rgba(240,68,56,.1);--pwgring:rgba(240,68,56,.2);--pw1solid:#1db873;--pw1solidink:#04150c;--pw1glow:rgba(29,184,115,.25);--pw2solid:#8fb733;--pw2solidink:#121b04;--pwwkbg:rgba(255,255,255,.025);--crit:#f04438;--shadow:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:28px 28px 64px}
header.top{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;
  background:radial-gradient(120% 140% at 100% 0%,rgba(144,195,34,.35) 0%,rgba(144,195,34,0) 55%),linear-gradient(125deg,#121b09 0%,#1b2a0e 55%,#25390f 100%);
  border:1px solid #2c3f16;border-radius:20px;padding:26px 28px;box-shadow:0 10px 30px rgba(20,33,8,.18);color:#f3f8ea}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--brand),#c4e57a 60%,var(--brand))}
header.top .sub{color:#c9d6b5}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.eyebrow::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--brand)}
h1{font-size:26px;margin:0 0 6px;font-weight:700;letter-spacing:-.015em;color:#fff}
.sub{color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink2);padding:10px 2px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wplabel{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
#hleft{flex:1 1 380px;min-width:0;max-width:560px}
#period{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px;margin-top:2px}
#period .plab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
#period .pdates{font-size:15px;font-weight:600;color:#fff}
#period .pcmp{flex-basis:100%;font-size:12.5px;color:#c9d6b5}
.rangebox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
.rangebox[hidden]{display:none}
.rangebox label{display:flex;flex-direction:column;font-size:12px;color:#c9d6b5;font-weight:600;gap:4px}
.rangebox input{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(144,195,34,.45);border-radius:10px;padding:8px 10px;color-scheme:dark}
.rangebox input:focus{outline:2px solid var(--brand);outline-offset:1px}
.rangebox button{font:inherit;font-size:14px;font-weight:700;color:var(--brand-ink);background:var(--brand);border:0;border-radius:10px;padding:9px 20px;cursor:pointer;box-shadow:0 4px 14px rgba(144,195,34,.35);transition:transform .12s, background .12s}
.rangebox button:hover{background:#a3d43a;transform:translateY(-1px)}
.rangemsg{font-size:12.5px;color:#ffb4a8;max-width:460px;text-align:right}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:rgba(0,0,0,.28);border:1px solid rgba(144,195,34,.35);border-radius:12px}
.seg[hidden]{display:none}
.seg button{appearance:none;font:inherit;font-size:13px;font-weight:600;color:#dfe8d2;background:transparent;border:0;border-radius:9px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.seg button:hover{background:rgba(144,195,34,.16);color:#fff}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 10px rgba(144,195,34,.35)}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.seg button[hidden]{display:none}
.pnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-height:38px}
.pnbtn{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid rgba(144,195,34,.45);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.pnbtn:hover:not(:disabled){background:rgba(144,195,34,.22)}
.pnbtn:disabled{opacity:.35;cursor:default}
.pnbtn:focus-visible,.pchip:focus-visible,.pchip:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.pchip{position:relative;appearance:none;display:inline-flex;align-items:center;gap:8px;height:38px;font:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(144,195,34,.45);border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.pchip:hover{background:rgba(144,195,34,.18)}
.pchip.static{cursor:default}.pchip.static:hover{background:rgba(255,255,255,.08)}
.pchip svg{flex:none;color:var(--brand)}
.pchip small{font-size:11.5px;font-weight:600;color:#c9d6b5}
.pchip .tag{font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:6px;padding:1px 6px}
.pchip select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font:inherit}
.pchip select option{color:#141b0d;background:#fff}
.pnav .sep{color:#c9d6b5;font-size:12.5px;font-weight:600}
.papply{appearance:none;font:inherit;font-size:14px;font-weight:700;color:var(--brand-ink);background:var(--brand);border:0;border-radius:10px;height:38px;padding:0 18px;cursor:pointer;box-shadow:0 4px 14px rgba(144,195,34,.35)}
.papply:hover{background:#a3d43a}
.calpop{position:absolute;z-index:50;width:288px;background:#18210f;border:1px solid rgba(144,195,34,.5);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:12px;color:#fff;font-size:13px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead strong{font-size:14px}
.calnav{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid rgba(144,195,34,.4);background:rgba(255,255,255,.06);color:#fff;cursor:pointer}
.calnav:disabled{opacity:.3;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.caldow{font-size:11px;font-weight:700;color:#9fb08a;text-align:center;padding:4px 0}
.calday{appearance:none;font:inherit;font-size:13px;font-weight:600;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:#eef4e4;cursor:pointer}
.calday:hover:not(:disabled){background:rgba(144,195,34,.2)}
.calday:disabled{color:#55604a;cursor:default}
.calday.latest{border-color:rgba(144,195,34,.55)}
.calday.on{background:var(--brand);color:var(--brand-ink)}
.calday:focus-visible,.calnav:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.calfoot{margin-top:8px;font-size:11.5px;color:#9fb08a;text-align:center}
.rangemsg:empty{display:none}
@media (max-width:700px){.hright{align-items:flex-start}.pnav{justify-content:flex-start}.rangemsg{text-align:left}}
.qpcell{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.qpcell a{color:var(--brand-dk, var(--brand));text-decoration:none;word-break:break-all}
.qpcell a:hover{text-decoration:underline}
.qpmore{appearance:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--brand-t);border:1px solid var(--brand-t2);border-radius:999px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.qpmore:hover{background:var(--brand);color:var(--brand-ink)}
.qpdetail>td{background:var(--card2);padding:10px 12px 12px!important}
.qpdetail .tblwrap{margin:0}
.hibadge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.hibadge.up{background:rgba(34,160,90,.16);color:var(--good)}
.hibadge.down{background:rgba(220,60,50,.14);color:var(--crit)}
.hibadge.steady{background:var(--brand-t);color:var(--ink2)}
.hibadge.none{background:transparent;color:var(--muted);border:1px solid var(--line)}
.hisum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink2);margin:4px 0 12px}
.spark{display:inline-block;vertical-align:middle}
.hipage{color:var(--brand-dk, var(--brand));text-decoration:none;word-break:break-word}
.hipage:hover{text-decoration:underline}
.infobar{display:flex;align-items:flex-start;gap:10px;background:var(--brand-t);border:1px solid var(--brand-t2);border-radius:12px;padding:10px 12px 10px 14px;font-size:13px;color:var(--ink2);margin-bottom:18px}
.infobar[hidden]{display:none}
.ibicon{flex:none;color:var(--brand);display:inline-flex;margin-top:1px}
.ibtext{flex:1;min-width:0}
.ibline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.iblink{appearance:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ibdetails{margin:6px 0 0;padding-left:18px}
.ibdetails[hidden]{display:none}
.ibdetails li{margin:2px 0}
.ibwarn{margin-top:6px;color:var(--serious, #e8a33d);font-weight:600}
.ibclose{flex:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.ibclose:hover{background:rgba(144,195,34,.18);color:var(--ink)}
.ibclose:focus-visible,.iblink:focus-visible,.noteopen:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.noteopen{appearance:none;font:inherit;font-size:12px;font-weight:600;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.noteopen[hidden]{display:none}
.histnote{background:var(--brand-t);border:1px solid var(--brand-t2);border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--ink2);margin-bottom:18px}
.sitechip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;color:#fff;background:rgba(144,195,34,.14);border:1px solid rgba(144,195,34,.4);border-radius:999px;padding:5px 12px 5px 8px}
.sitechip i{width:18px;height:18px;border-radius:50%;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;color:var(--brand-ink);font-style:normal;font-size:11px}
.panel[hidden]{display:none}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%}
.subnavwrap{position:sticky;top:10px;z-index:6;display:flex;justify-content:center;margin:4px 0 24px;pointer-events:none}
.subnavwrap .subnav{pointer-events:auto}
.subnav{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;padding:5px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px -8px rgba(16,24,40,.18)}
.subnav button{appearance:none;font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--ink2);border-radius:999px;padding:9px 18px;cursor:pointer;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;display:inline-flex;align-items:center;gap:8px;outline:none}
.subnav button:hover{background:var(--card2);color:var(--ink)}
.subnav button:focus-visible{box-shadow:0 0 0 2px var(--brand)}
.subnav button[aria-pressed="true"]{background:linear-gradient(180deg,#a3d13a,#8cbf20);color:#14200a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(16,24,40,.12)}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:transform .18s}
.subnav button:hover .tdot{transform:scale(1.25)}
.tdot.t-overview{background:var(--brand)}.tdot.t-gsc{background:#2a78d6}.tdot.t-bing{background:#0e9f9a}.tdot.t-ga4{background:#f79009}.tdot.t-semrush{background:#7a5af8}.tdot.t-ai{background:#c43be0}
.subnav button[aria-pressed="true"] .tdot{background:#14200a;opacity:.7}
@media (max-width:760px){.subnav{border-radius:16px}.subnav button{padding:8px 12px;font-size:13px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.card>h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.card>h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.kcard>h2::before{display:none}
.card>.desc{margin:0 0 16px}
.desc{font-size:12.5px;color:var(--ink2);margin:2px 0 12px;max-width:1000px}
.headline{font-size:17px;font-weight:600;margin:6px 0 12px;line-height:1.45}
.summary ul{margin:0;padding-left:20px}.summary li{margin:6px 0;color:var(--ink2)}
.kgroup-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
.kgroup-title:first-of-type{margin-top:8px}
.kgroup-title::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
.kgroup-title.gsc::before{background:var(--gsc)}.kgroup-title.ga::before{background:var(--ga)}.kgroup-title.sem::before{background:var(--sem)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcard{border-top:3px solid var(--brand);padding-top:18px}
.kcard{background:linear-gradient(180deg,var(--brand-t) 0,var(--card) 90px)}
.khead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.khead h2{font-size:16px;margin:0;font-weight:700}
.kdot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.kcard.bing .kdot{background:#0e9f9a}
.kpis.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.kpis.kpis3{grid-template-columns:1fr}}.kcard.gsc .kdot{background:var(--gsc)}.kcard.ga .kdot{background:var(--ga)}.kcard.sem .kdot{background:var(--sem)}
.ksub{font-size:12.5px;color:var(--muted);margin-left:auto}
.ksubline{font-size:12.5px;color:var(--muted);margin:-8px 0 14px}
.kpi{position:relative;display:flex;flex-direction:column;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;transition:border-color .15s, box-shadow .15s}
.kpis9 .kpi:nth-child(n+7){grid-column:span 2}
@media (max-width:1180px){.kpis9 .kpi:nth-child(n+7){grid-column:auto}}
.kpis7{grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.kpis7 .kpi{padding:14px 14px}
.kpis7 .kpi .v{font-size:24px}
.kpis7 .kpi .l{line-height:1.45;min-height:2.9em}
.kpis7 .kpi .d{font-size:11.5px}
@media (max-width:1180px){.kpis7{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){.kpis7{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis7{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(144,195,34,.15)}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .l{min-height:2.6em}
.kpi .v{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ink2)}
.up{color:var(--good-ink)}.down{color:var(--crit)}.flat{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:20px}
.grid2>.card{margin-bottom:0}
.grid2{margin-bottom:20px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.wrap{padding:16px}}
.block{border-top:1px solid var(--line);padding-top:20px;margin-top:26px}
.card>h2+.block,.card>.desc+.block,.card>h2+.stack>.block:first-child,.card>.desc+.stack>.block:first-child,.card>.kpis+.block{border-top:0;padding-top:4px;margin-top:6px}
.card>.kpis+.block{margin-top:18px}
.tblwrap{margin-bottom:2px}
.block h3{font-size:14.5px;margin:0 0 2px;font-weight:700;color:var(--ink)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.headrow>.headtxt{min-width:0;flex:1 1 0}
.headrow>.tsearchrow{flex:0 0 auto;margin:0}
@media (min-width:821px){.headrow{flex-wrap:nowrap;align-items:center}.headrow>.tsearchrow{margin-top:0}}
.headrow>.headtxt>.desc{margin:2px 0 0}
.headrow>.headtxt>h2{margin:0}
.card>.headrow>.headtxt>h2{display:flex;align-items:center;gap:10px}
.card>.headrow>.headtxt>h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
@media (max-width:640px){.headrow>.tsearchrow{width:100%;justify-content:flex-start}.headrow .tsearch{width:100%}}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

  else if (st.m === "custom") ok = showRange(st.a, st.b, st.a === st.b ? "Day" : "Custom range") !== false;
  if (!ok){ var msg = rmsg.textContent; PS = prev; renderNav(); rmsg.textContent = msg; return; }
  delete PS.apply; var sc = PS.scroll; delete PS.scroll;
  renderNav(); saveHash();
  if (sc !== false) window.scrollTo({top:0});
}
document.getElementById("noteopen").addEventListener("click", function(){ setNotesHidden(false); syncNotes(); });
seg.addEventListener("click", function(e){
  var b = e.target.closest("button[data-m]"); if (!b) return;
  var m = b.getAttribute("data-m"); if (m === PS.m) return;
  if (m === "day") go({m:"day", d:LATEST});
  else if (m === "week") go({m:"week", i:0});
  else if (m === "custom") go({m:"custom", a: R && R.period ? R.period.current[0] : null, b: R && R.period ? R.period.current[1] : null});
  else go({m:m});
});
function initPeriod(){
  var bd = dayBounds(); DMIN = bd[0]; LATEST = bd[1]; hasDaily = !!LATEST;
  Array.prototype.forEach.call(seg.children, function(b){ b.hidden = !hasDaily && b.getAttribute("data-m") !== "week"; });
  if (!hasDaily && D.weeks.length < 2) seg.hidden = true;
  go(Object.assign(readHash() || (hasDaily ? {m:"d7"} : {m:"week", i:0}), {scroll:false}));
}
function gunzipB64(b64){
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
// Show plain dashes instead of em dashes everywhere, including text that comes from the data.
function noEmDash(root){
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
  while ((n = w.nextNode())) if (n.nodeValue.indexOf("\u2014") >= 0) n.nodeValue = n.nodeValue.replace(/\u2014/g, "-");
  if (root.querySelectorAll) Array.prototype.forEach.call(root.querySelectorAll("[title],[placeholder]"), function(e){
    ["title","placeholder"].forEach(function(a){ var v = e.getAttribute(a); if (v && v.indexOf("\u2014") >= 0) e.setAttribute(a, v.replace(/\u2014/g, "-")); });
  });
}
new MutationObserver(function(ms){ ms.forEach(function(m){
  if (m.type === "characterData"){ if (m.target.nodeValue.indexOf("\u2014") >= 0) m.target.nodeValue = m.target.nodeValue.replace(/\u2014/g, "-"); }
  else Array.prototype.forEach.call(m.addedNodes, function(x){ if (x.nodeType === 3){ if (x.nodeValue.indexOf("\u2014") >= 0) x.nodeValue = x.nodeValue.replace(/\u2014/g, "-"); } else if (x.nodeType === 1) noEmDash(x); });
}); }).observe(document.body, {childList:true, subtree:true, characterData:true});
function boot(d){
  D = d.weeks ? d : {title: d.title, weeks: [d]};
  R = D.weeks[0];
  document.getElementById("title").textContent = D.title || "SEO Dashboard";
  // open on the latest data (last 7 days up to yesterday); fall back to the latest weekly report
  loadDaily().then(function(){
    initPeriod();
  });
}
(function(){
  var el = document.getElementById("report-data"), txt = el.textContent.trim();
  if (el.getAttribute("data-enc") === "gzip-b64" && txt.charAt(0) !== "{"){
    if (typeof DecompressionStream === "undefined"){ document.getElementById("panels").textContent = "This browser cannot open the dashboard data. Please use a current version of Chrome, Edge, Safari or Firefox."; return; }
    gunzipB64(txt).then(function(t){ boot(JSON.parse(t)); }).catch(function(e){ document.getElementById("panels").textContent = "Could not read the dashboard data (" + e + ")."; });
  } else boot(JSON.parse(txt));
})();
})();
</script>
