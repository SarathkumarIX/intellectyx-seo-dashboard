name: Daily SEO dashboard refresh

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them when busy, so try three times a day
    # (06:47, 09:47 and 15:47 IST). Each run only re-pulls the last few days, so extra runs are cheap.
    - cron: "17 1,4,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Get saved data (state + weekly branches, encrypted)
        run: |
          mkdir -p work/state work/weekly
          for b in state weekly; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              git fetch -q --depth=1 origin "$b"
              git archive FETCH_HEAD | tar -x -C "work/$b"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Pull Search Console + GA4 and build the dashboard
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          PROMPTWATCH_API_KEY: ${{ secrets.PROMPTWATCH_API_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_SA_FILE="$RUNNER_TEMP/sa.json" python cloud/run_cloud.py work out
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Save (state branch, one commit, encrypted)
        working-directory: out
        run: |
          git init -q -b state
          git config user.name "seo-dashboard-bot"
          git config user.email "seo-dashboard-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily refresh $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
