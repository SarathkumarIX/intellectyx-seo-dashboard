name: Daily SEO dashboard refresh

on:
  # GitHub cron is always written in UTC. Times below in IST (Asia/Kolkata = UTC + 5:30).
  # GitHub starts scheduled runs late (often 4-8 hours) or skips some, so the refresh is tried
  # every hour through the night: whichever run starts first has the new day ready before 11:00 IST.
  # Each run only re-pulls the last few days, so extra runs are cheap.
  schedule:
    - cron: "41 19-23 * * *"   # 01:11, 02:11, 03:11, 04:11, 05:11 IST
    - cron: "41 0-4 * * *"     # 06:11, 07:11, 08:11, 09:11, 10:11 IST
    - cron: "41 10 * * *"      # 16:11 IST - Search Console closes yesterday (US Pacific day) around 15:30 IST
    - cron: "41 15 * * *"      # 21:11 IST - evening top-up
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Get saved data (state + weekly branches, encrypted)
        run: |
          mkdir -p work/state work/weekly
          for b in state weekly; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              git fetch -q --depth=1 origin "$b"
              git archive FETCH_HEAD | tar -x -C "work/$b"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Pull Search Console + GA4 and build the dashboard
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          PROMPTWATCH_API_KEY: ${{ secrets.PROMPTWATCH_API_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_SA_FILE="$RUNNER_TEMP/sa.json" python cloud/run_cloud.py work out
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Save (state branch, one commit, encrypted)
        working-directory: out
        run: |
          git init -q -b state
          git config user.name "seo-dashboard-bot"
          git config user.email "seo-dashboard-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily refresh $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
